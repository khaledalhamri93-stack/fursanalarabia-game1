<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مغامرة الفعل المعتل</title>
<meta name="theme-color" content="#0b3d4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الفعل المعتل">
<meta name="format-detection" content="telephone=no">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
/* شاشة لعبة بألوان نشاط ١: سماء ليلية فيروزية، أزرار ثلاثية الأبعاد، شريط حالة علوي */
:root{color-scheme:dark;--teal:#0f9d9a;--teal-d:#0b6e75;--orange:#ff8a3d;--orange-d:#c9611f;--yellow:#ffd34e;--yellow-d:#d9a91c;--pink:#ff6f91;--pink-d:#c94a6b;--sky1:#0b3d4a;--sky2:#14254a;--ink:#1d2b3a;--card:#fffdf7;--ok:#2ecc71;--no:#ff5b5b;--txt:#fff;
--disp:'Lalezar','Cairo',Tahoma,sans-serif;--body:'Cairo','Segoe UI',Tahoma,Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}button{-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;font-family:var(--body);color:var(--txt);background:radial-gradient(circle at 80% 0%,#1d6f78 0%,transparent 45%),radial-gradient(circle at 0% 100%,#3b2a6b 0%,transparent 50%),linear-gradient(160deg,var(--sky1),var(--sky2));background-attachment:fixed;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding-block:12px 20px}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
/* أزرار ثلاثية الأبعاد */
.b3d{border:0;border-radius:18px;color:#fff;font-weight:900;padding:10px 26px;font-size:19px;background:var(--c,var(--teal));box-shadow:0 6px 0 var(--cd,var(--teal-d)),0 10px 18px rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.b3d:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--cd,var(--teal-d)),0 3px 8px rgba(0,0,0,.3)}
.b3d.y{--c:var(--yellow);--cd:var(--yellow-d);color:var(--ink);text-shadow:none}
.b3d.p{--c:var(--pink);--cd:var(--pink-d)}
.b3d.o{--c:var(--orange);--cd:var(--orange-d)}
.b3d.g{--c:#3d5a73;--cd:#26394a}
/* الشاشة الرئيسية */
.hdr{background:#fff;border-radius:14px;padding:4px 10px;margin:0 auto 10px;max-width:520px}
.hdr img{display:block;margin:0 auto;height:52px;max-width:100%;object-fit:contain}
.logo{text-align:center;margin:6px 0 4px}
.logo h1{font-family:var(--disp);font-weight:400;font-size:clamp(34px,7vw,58px);line-height:1.15;margin:0;color:var(--yellow);text-shadow:0 4px 0 var(--orange-d),0 8px 18px rgba(0,0,0,.45);text-wrap:balance}
.logo p{margin:2px 0 0;font-weight:800;color:#bdeeed;font-size:16px}
.player{margin:14px auto;max-width:560px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);border-radius:20px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.player .av{flex:none;width:52px;height:52px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:28px;box-shadow:0 4px 0 var(--yellow-d)}
.player label{font-weight:900;color:var(--yellow);flex:none}
.player select,.player input{flex:1;min-width:0;font:inherit;font-weight:800;font-size:17px;padding:8px 12px;border-radius:14px;border:3px solid var(--orange);background:#fff;color:var(--ink)}
.player .warn{flex-basis:100%;margin:0;color:#ffc2cf;font-weight:700;font-size:14px}
.worlds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:8px}
.world{position:relative;text-align:center;border:0;border-radius:22px;padding:16px 10px 14px;color:#fff;background:var(--c);box-shadow:0 7px 0 var(--cd),0 12px 22px rgba(0,0,0,.35);transition:transform .1s}
.world:hover{transform:translateY(-3px)}
.world:active{transform:translateY(5px);box-shadow:0 2px 0 var(--cd)}
.world .ic{font-size:44px;line-height:1.2;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
.world .nm{display:block;font-family:var(--disp);font-size:24px;line-height:1.3}
.world .sub{display:block;font-weight:700;font-size:14px;opacity:.95}
.world .best{position:absolute;top:8px;left:10px;background:rgba(0,0,0,.25);border-radius:999px;padding:0 10px;font-weight:800;font-size:13px}
.world .lv{position:absolute;top:8px;right:10px;background:#fff;color:var(--ink);border-radius:999px;padding:0 10px;font-weight:900;font-size:13px}
.w1{--c:var(--teal);--cd:var(--teal-d)}.w2{--c:var(--orange);--cd:var(--orange-d)}.w3{--c:var(--pink);--cd:var(--pink-d)}.w4{--c:#6c5ce7;--cd:#4b3db8}
.opts-row{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.toggle{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:4px 16px;font-weight:800}
.toggle[aria-pressed="true"]{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.credits{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:18px;font-weight:700;font-size:13.5px;color:#a9cfd6;border-top:1px dashed rgba(255,255,255,.2);padding-top:8px}
/* شريط الحالة */
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(0,0,0,.25);border-radius:18px;padding:6px 10px}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:999px;padding:2px 12px;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.nm{max-width:44%;overflow:hidden;text-overflow:ellipsis;background:var(--yellow);color:var(--ink)}
.pill.sp{margin-inline-start:auto}
.dots{display:flex;gap:5px;margin:10px 0 4px;justify-content:center}
.dots i{width:22px;height:9px;border-radius:999px;background:rgba(255,255,255,.18)}
.dots i.ok{background:var(--ok)}.dots i.no{background:var(--no)}.dots i.cur{background:var(--yellow);box-shadow:0 0 0 3px rgba(255,211,78,.3)}
.timer{height:12px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden;margin:6px 0 10px}
.timer div{height:100%;width:100%;background:linear-gradient(90deg,var(--no),var(--yellow),var(--ok));transform-origin:right;transition:transform .2s linear}
/* بطاقة السؤال */
.qcard{background:var(--card);color:var(--ink);border-radius:24px;padding:14px 16px 16px;box-shadow:0 10px 0 rgba(0,0,0,.18),0 18px 30px rgba(0,0,0,.35);border:4px solid var(--teal)}
.qtop{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--teal-d);font-size:16px}
.qtop .n{flex:none;width:38px;height:38px;border-radius:12px;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:18px;box-shadow:0 3px 0 var(--orange-d)}
.qtop .tag{margin-inline-start:auto;background:var(--teal);color:#fff;border-radius:999px;padding:0 12px;font-size:13.5px}
.sent{margin-top:10px;background:#eaf8f7;border-radius:16px;padding:12px 14px;font-size:clamp(20px,4.6vw,27px);font-weight:800;text-align:center;line-height:1.7}
.sent u{text-decoration-thickness:3px;text-underline-offset:8px;color:var(--pink-d)}
.sent .gap{display:inline-block;min-width:96px;border-bottom:4px dashed var(--orange);color:var(--orange)}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.answers.long{grid-template-columns:1fr}
.ans{position:relative;min-height:66px;font-size:clamp(19px,4vw,24px);border-radius:18px;padding:8px 16px 8px 14px;display:flex;align-items:center;justify-content:center;gap:10px;line-height:1.45}
.answers.long .ans{justify-content:flex-start;font-size:17px;text-align:right;min-height:58px}
.ans .sh{flex:none;width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:15px}
.ans:disabled{cursor:default}
.ans.dim{opacity:.35}
.ans.right{--c:var(--ok);--cd:#1e8e4e;opacity:1;animation:bounce .4s}
.ans.wrong{--c:var(--no);--cd:#b83a3a;opacity:1;animation:shake .35s}
.fb{margin-top:14px;border-radius:16px;padding:8px 14px;font-weight:700;display:flex;gap:10px;align-items:flex-start;font-size:16px}
.fb.ok{background:#e3f9ec;border:2px solid var(--ok)}.fb.no{background:#ffe9e9;border:2px solid var(--no)}
.fb b{flex:none;font-size:17px}
.next{display:flex;justify-content:center;margin-top:14px}
.float{position:fixed;font-family:var(--disp);font-size:34px;color:var(--yellow);text-shadow:0 3px 0 var(--orange-d);pointer-events:none;z-index:40;animation:up 1s ease-out forwards}
/* القاعدة */
.rule{background:var(--card);color:var(--ink);border-radius:24px;padding:16px;border:4px dashed var(--yellow);box-shadow:0 12px 26px rgba(0,0,0,.35);text-align:center}
.rule .ic{font-size:50px;line-height:1.1}
.rule h2{font-family:var(--disp);font-weight:400;font-size:28px;margin:4px 0;color:var(--teal-d)}
.rule p{margin:0 auto;max-width:60ch;font-weight:700;font-size:17px;line-height:1.8}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
.chips span{background:#fff4e8;border:2.5px solid var(--orange);border-radius:999px;padding:2px 14px;font-weight:800}
.btns{display:flex;justify-content:center;gap:12px;margin-top:16px;flex-wrap:wrap}
/* النهاية */
.end{text-align:center}
.trophy{font-size:80px;line-height:1.1;animation:bounce 1s infinite alternate}
.stars{font-size:60px;letter-spacing:8px;line-height:1.1}
.stars span{color:rgba(255,255,255,.18)}
.stars .lit{color:var(--yellow);text-shadow:0 4px 0 var(--orange-d);display:inline-block;animation:pop .5s backwards}
.stars .lit:nth-child(2){animation-delay:.2s}.stars .lit:nth-child(3){animation-delay:.4s}
.end h2{font-family:var(--disp);font-weight:400;font-size:32px;margin:6px 0;color:#fff}
.grade{display:inline-flex;flex-direction:column;align-items:center;background:var(--card);color:var(--ink);border-radius:22px;padding:6px 26px;border:4px solid var(--pink);box-shadow:0 6px 0 var(--pink-d)}
.grade small{font-weight:800;color:var(--pink-d)}
.grade b{font-family:var(--disp);font-weight:400;font-size:48px;line-height:1.1;font-variant-numeric:tabular-nums}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.badge{display:inline-block;margin-top:12px;background:var(--yellow);color:var(--ink);border-radius:14px;padding:4px 18px;font-weight:900;box-shadow:0 4px 0 var(--yellow-d)}
/* صفحة النتائج */
.teacher{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:4px 16px;font-weight:800}
.saved{margin-top:10px;font-weight:700;font-size:14px;color:#bdeeed}
.rp{background:var(--card);color:var(--ink);border-radius:24px;padding:14px 16px;border:4px solid var(--teal);box-shadow:0 12px 26px rgba(0,0,0,.35)}
.rp h1{font-family:var(--disp);font-weight:400;font-size:32px;margin:0;color:var(--teal-d);line-height:1.3}
.rp .meta{margin:0;color:#4b5b68;font-weight:700;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.kpi{border-radius:16px;padding:6px 10px;text-align:center;background:#eaf8f7;border:2px solid #bfe6e4}
.kpi b{display:block;font-family:var(--disp);font-weight:400;font-size:30px;line-height:1.2;color:var(--teal-d);font-variant-numeric:tabular-nums}
.kpi span{font-weight:700;font-size:13px;color:#4b5b68}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.tab{border:2px solid var(--teal);background:#fff;color:var(--teal-d);border-radius:999px;padding:2px 16px;font-weight:800}
.tab[aria-selected="true"]{background:var(--teal);color:#fff}
.scroll{overflow-x:auto;border-radius:14px;border:2px solid #e2ecee}
table.res{width:100%;border-collapse:collapse;font-size:14.5px;min-width:560px}
.res th{background:var(--teal-d);color:#fff;font-weight:800;padding:6px 8px;text-align:right;position:sticky;top:0}
.res td{padding:5px 8px;border-top:1px solid #edf2f3;font-weight:600;font-variant-numeric:tabular-nums}
.res tr:nth-child(even) td{background:#f7fbfb}
.res td.c{text-align:center}
.sc{display:inline-block;min-width:48px;text-align:center;border-radius:999px;padding:0 8px;font-weight:900}
.s3{background:#d9f5e5;color:#1e7a46}.s2{background:#fff1c7;color:#8a6400}.s1{background:#ffe3d1;color:#a24a12}.s0{background:#ffe0e0;color:#b33}.sn{color:#9aa7b0}
.empty{text-align:center;padding:18px;font-weight:700;color:#4b5b68}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:12px;align-items:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#ffe9e9;border:2px solid var(--no);border-radius:14px;padding:6px 10px;font-weight:800}
.note{font-size:13.5px;font-weight:700;color:#4b5b68;margin:8px 0 0}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)}}
/* أنماط اللعب */
.rule.mini{padding:10px 14px}.rule.mini .ic{font-size:34px}.rule.mini h2{font-size:22px}.rule.mini p{font-size:15px}
h3.pick{font-family:var(--disp);font-weight:400;font-size:26px;text-align:center;margin:14px 0 4px;color:var(--yellow);text-shadow:0 3px 0 var(--orange-d)}
.w5{--c:#1e88e5;--cd:#1565c0}.world.wide{grid-column:1/-1}
.trail{background:rgba(0,0,0,.25);border-radius:18px;padding:6px 10px;margin:10px 0}
.tr-top{display:flex;justify-content:space-between;align-items:center;font-weight:900;gap:8px;flex-wrap:wrap}
.zone{color:var(--yellow)}.hearts{font-size:20px;letter-spacing:2px}.hearts .lost{filter:grayscale(1);opacity:.3}
.path{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding-top:18px}
.node{position:relative;flex:none;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:15px;border:2px solid rgba(255,255,255,.25)}
.node.ok{background:#2ecc71;border-color:#2ecc71}.node.no{background:var(--no);border-color:var(--no)}.node.cur{background:var(--yellow);border-color:#fff;box-shadow:0 0 0 4px rgba(255,211,78,.35)}
.node .hero{position:absolute;top:-24px;font-size:20px;animation:bounce .5s infinite alternate}
.seg{flex:1;height:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 5px,transparent 5px 9px);min-width:4px}
.memtop{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.memtop b{font-variant-numeric:tabular-nums}
.hint{text-align:center;font-weight:700;color:#bdeeed;margin:8px 0}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mcard{position:relative;aspect-ratio:3/2.6;max-width:100%;border:0;border-radius:16px;padding:0;perspective:600px;background:transparent}
.mcard span{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;padding:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .35s;font-weight:900;line-height:1.35}
.mcard .back{background:linear-gradient(135deg,#6c5ce7,#4b3db8);font-size:30px;box-shadow:0 5px 0 #392e8f}
.mcard .face{transform:rotateY(180deg);background:var(--card);color:var(--ink);font-size:clamp(13px,3.4vw,17px);border:3px solid var(--orange);box-shadow:0 5px 0 var(--orange-d)}
.mcard .face.b{border-color:var(--teal);box-shadow:0 5px 0 var(--teal-d);font-size:clamp(12px,3vw,15px)}
.mcard.up .back{transform:rotateY(180deg)}.mcard.up .face{transform:rotateY(360deg)}
.mcard.done .face{background:#d9f5e5;border-color:#2ecc71;box-shadow:0 5px 0 #1e8e4e}
.mcard.bad .face{background:#ffe0e0;border-color:var(--no);animation:shake .35s}
.snq{background:var(--card);color:var(--ink);border-radius:16px;padding:6px 12px;text-align:center;margin:8px 0;border:3px solid var(--yellow)}
.snq small{display:block;font-weight:900;color:var(--teal-d);font-size:14px}
.snq div{font-size:clamp(19px,4.4vw,25px);font-weight:900}.snq .gap{display:inline-block;min-width:70px;border-bottom:4px dashed var(--orange);color:var(--orange)}
.snwrap{position:relative;width:max-content;max-width:100%;margin:0 auto;border-radius:16px;overflow:hidden;border:4px solid var(--teal);box-shadow:0 10px 24px rgba(0,0,0,.35);touch-action:none}
.snwrap canvas{display:block;max-width:100%}
.snover{position:absolute;inset:0;background:rgba(11,61,74,.82);display:grid;place-items:center;text-align:center;padding:14px}
.snover b{display:block;font-size:19px;margin:4px 0}.snover p{margin:0 0 10px;font-size:14px;color:#bdeeed}
.pad{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:12px}.pad div{display:flex;gap:8px}
.pad .b3d{width:64px;height:54px;padding:0;font-size:22px}.pad.row{flex-direction:row;justify-content:center;gap:24px}.pad.row .b3d{width:110px}
@media (max-width:600px){.mgrid{grid-template-columns:repeat(3,1fr)}.node{width:24px;height:24px;font-size:12px}}
/* الأوسمة */
.lvcard{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.2);border-radius:16px;padding:6px 10px;margin-top:4px;flex-wrap:wrap}
.lvi{font-size:30px}.lvb{flex:1;min-width:150px}.lvb b{color:var(--yellow)}.lvb small{font-weight:700;color:#bdeeed;font-variant-numeric:tabular-nums}
.xp{height:10px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden;margin:3px 0}.xp div{height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange))}
.lvbtn{border:0;border-radius:999px;background:var(--pink);color:#fff;font-weight:900;padding:4px 14px;box-shadow:0 3px 0 var(--pink-d)}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.bdg{border-radius:16px;padding:8px 6px;text-align:center;background:#eef2f3;border:2px dashed #c9d3d7;color:#7d8b95;line-height:1.4}
.bdg .bi{display:block;font-size:34px;filter:grayscale(1);opacity:.6}.bdg b{display:block;font-size:14.5px}.bdg small{display:block;font-size:12px;font-weight:600}
.bdg.got{background:linear-gradient(160deg,#fff6d6,#ffe9b0);border:2px solid var(--yellow);color:var(--ink);box-shadow:0 4px 0 var(--yellow-d)}.bdg.got .bi{filter:none;opacity:1}
.newb{background:rgba(255,255,255,.08);border:2px dashed var(--yellow);border-radius:18px;padding:8px 10px;margin:12px auto 0;max-width:620px}
.newb h3{margin:0;font-family:var(--disp);font-weight:400;font-size:26px;color:var(--yellow)}
.lvup{display:inline-block;margin-top:10px;background:var(--teal);border-radius:14px;padding:4px 16px;font-weight:800;box-shadow:0 4px 0 var(--teal-d)}
.lvls{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.lvls span{flex:1;min-width:80px;text-align:center;border-radius:12px;padding:2px 6px;background:#eef2f3;color:#7d8b95;font-weight:800;font-size:14px}
.lvls span small{display:block;font-size:11px}.lvls span.on{background:#eaf8f7;color:var(--teal-d);border:2px solid var(--teal)}
@media (max-width:600px){.bgrid{grid-template-columns:repeat(2,1fr)}}
.confetti{position:fixed;top:-14px;width:10px;height:14px;border-radius:2px;pointer-events:none;z-index:50;animation:fall linear forwards}
.screen{animation:pop .3s ease-out}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(.85);opacity:.3}100%{transform:scale(1);opacity:1}}
@keyframes up{to{transform:translateY(-70px);opacity:0}}

<script>window.KIT_CFG={"id": "verb", "prefix": ["mu3tal-"], "title": "مغامرة الفعل المعتل", "fem": false, "accent": "#0f9d9a", "accent2": "#ff8a3d", "sign": ["معلم اللغة العربية: أ. خالد الحمري", "مدير المدرسة: أ. حمود أحمد"]};
/* ===== عُدّة مشتركة: الصوت والموسيقى والإعدادات والنسخ الاحتياطي والشهادات ===== */
(function(){
const C=window.KIT_CFG||{id:'game',prefix:[],title:'اللعبة',fem:false,accent:'#0f9d9a',accent2:'#ffd34e',sign:[]};
const KEY=C.id+'-settings';
const DEF={master:.8,muted:false,sfxOn:true,sfx:.9,musicOn:true,music:.5,bright:1,pw:'1234',lock:true};

/* ---------- المؤثرات: كل لعبة تمرّر صوتها من هنا ---------- */
const outs=[];

/* ---------- موسيقى الخلفية (تُولَّد داخل الصفحة) ---------- */
let mctx=null,mg=null,timer=null,step=0,nextT=0,started=false;

           76,null,79,81,79,76,72,null,74,77,81,77,76,74,72,null,72,76,79,84,83,81,79,77,76,74,72,74,72,null,null,null];

           48,55,52,55,53,57,60,57,50,53,57,53,55,59,62,59,45,52,48,52,53,57,60,57,55,59,55,50,48,null,48,null];
function note(f,t,d,type,v){const o=mctx.createOscillator(),g=mctx.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(mg);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.start(t);o.stop(t+d+.02)}
function hat(t,v){const n=mctx.createBufferSource(),b=mctx.createBuffer(1,mctx.sampleRate*.05,mctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
 const hp=mctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=6000;const g=mctx.createGain();g.gain.value=v;n.buffer=b;n.connect(hp);hp.connect(g);g.connect(mg);n.start(t)}
function tick(){if(!mctx)return;while(nextT<mctx.currentTime+.25){const i=step%MEL.length;
  if(MEL[i])note(mid(MEL[i]),nextT,SP*.9,'square',.16);
  if(BAS[i])note(mid(BAS[i]),nextT,SP*1.6,'triangle',.3);
  if(i%2===0)hat(nextT,.07);
  nextT+=SP;step++}}
function musicStart(){
 if(vMus()===0)return musicPause();
 try{if(!mctx){mctx=new (window.AudioContext||window.webkitAudioContext)();mg=mctx.createGain();mg.gain.value=vMus();mg.connect(mctx.destination);nextT=mctx.currentTime+.1}
  if(mctx.state!=='running'){const r=mctx.resume();if(r&&r.then)r.then(()=>{nextT=Math.max(nextT,mctx.currentTime+.05)})}if(!timer){nextT=Math.max(nextT,mctx.currentTime+.05);timer=setInterval(tick,60);if(!window.__kitMusToast){window.__kitMusToast=1;setTimeout(()=>{if(isPlaying())toast('🎵 الموسيقى تعمل — يمكنك إيقافها من زر 🔊')},500)}}started=true}catch(e){}}

/* آيفون: يُفتح الصوت فقط داخل لمسة حقيقية (رفع الإصبع أو النقر)، ويجب تجاوز زر الصامت */
let silentEl=null;
function silentWav(){const sr=8000,n=800,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};

 if(mctx&&mctx.state!=='running')try{mctx.resume()}catch(e){}
 outs.forEach(g=>{try{if(g.context.state!=='running')g.context.resume()}catch(e){}});
}
const gesture=()=>{unlockAudio();if(vMus()>0&&(!mctx||mctx.state!=='running'||!timer))musicStart()};
['pointerup','touchend','click','keydown'].forEach(ev=>addEventListener(ev,gesture,{passive:true,capture:true}));

function apply(){
 outs.forEach(g=>{try{g.gain.value=vSfx()}catch(e){}});
 if(mg)try{mg.gain.setTargetAtTime(vMus(),mctx.currentTime,.05)}catch(e){}
 if(vMus()===0)musicPause();else if(started)musicStart();
 document.documentElement.style.filter=S.bright===1?'':`brightness(${S.bright})`;
 const m=$k('kitMute');if(m){m.textContent=S.muted?'🔇':'🔊';m.setAttribute('aria-label',S.muted?'تشغيل الصوت':'كتم الصوت');m.classList.toggle('off',S.muted)}
}
function testSfx(){let c;try{c=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}const out=SND.out(c);
 [523,659,784,1046].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(out);const t=c.currentTime+i*.1;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.22)});
 setTimeout(()=>{try{c.close()}catch(e){}},1200)}
function testMusic(){unlockAudio();started=true;musicStart();setTimeout(()=>{if(vMus()===0)toast('موسيقى الخلفية مغلقة أو مستواها صفر');else if(!isPlaying())toast('لم يعمل الصوت. تأكد من رفع صوت الجهاز')},400)}

 try{const dl=window.claude&&claude.use?await claude.use('downloads'):null;if(dl){await dl.save({filename:name,data:blob});return true}}catch(e){if(e&&e.code==='declined')return false}

}

 if(o.stars!=null){x.font="80px sans-serif";x.fillText([0,1,2].map(k=>k<o.stars?'⭐':'☆').join(' '),W/2,y+70);y+=100}

let DB=null,USER=null,isTeacher=false,dbReady=false;
const LOCAL_KEY='mu3tal-results';
function localAll(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]')}catch(e){return[]}}
function localAdd(r){try{const a=localAll();a.push(r);localStorage.setItem(LOCAL_KEY,JSON.stringify(a))}catch(e){}}
async function saveResult(r){
 if(DB){try{await DB.collection('results').add(r);return 'shared'}catch(e){}}
 localAdd(r);return 'local';
}
async function loadResults(){
 if(DB){try{const s=await DB.collection('results').orderBy('at','desc').limit(500).get();return s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){}}
 return localAll().slice().reverse();
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let ac;function beep(kind){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;
 const seq=kind==='ok'?[660,880,1100]:kind==='no'?[240,180]:kind==='win'?[523,659,784,1046]:[440];
 seq.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(window.SND?SND.out(ac):ac.destination);const s=t+i*.09;g.gain.setValueAtTime(.16,s);g.gain.exponentialRampToValueAtTime(.001,s+.22);o.start(s);o.stop(s+.24)})}catch(e){}}

/* ===== لعبة الثعبان ===== */
/* [مرفوع، منصوب، مجزوم، تكملة الجملة] */
const VERBS=[
 ['يدعو','يدعوَ','يدعُ','الطالبُ إلى الخير'],['يرجو','يرجوَ','يرجُ','المجتهدُ النجاحَ'],['يسمو','يسموَ','يسمُ','المؤمنُ بأخلاقه'],
 ['يعلو','يعلوَ','يعلُ','الصوتُ في الصف'],['يمشي','يمشيَ','يمشِ','الطفلُ بهدوء'],['يبني','يبنيَ','يبنِ','العاملُ البيتَ'],
 ['يجري','يجريَ','يجرِ','اللاعبُ في الملعب'],['يرمي','يرميَ','يرمِ','اللاعبُ الكرةَ'],['يسعى','يسعى','يسعَ','الطالبُ إلى العلم'],['يرقى','يرقى','يرقَ','المجتهدُ إلى القمة']
];
const TOOLS=[[''],['لن','يجب أن','كي'],['لم']];
const CASEN=['المرفوع','المنصوب','المجزوم'];
function snakeRounds(i){
 return shuffle(VERBS).map(v=>{
  const c=L.mix?Math.floor(Math.random()*3):i;
  const right=v[c];let wrong=[...new Set(v.slice(0,3))].filter(x=>x!==right);
  if(v[2].endsWith('َ')&&wrong.length<2)wrong.push(v[0].replace(/ى$/,'ي'));
  if(wrong.length<2)wrong.push(v[0].replace(/[وي]$/,m=>m==='و'?'وا':'يْ'));
  const tool=TOOLS[c][Math.floor(Math.random()*TOOLS[c].length)];
  return {c,right,wrong:wrong.slice(0,2),prompt:(tool?tool+' ':'')+'<span class="gap">؟</span> '+v[3],plain:(tool?tool+' ':'')+right+' '+v[3]};
 });
}
let SN=null;
function stopSnake(){if(SN){SN.stop=true;clearTimeout(SN.t);if(SN.key)removeEventListener('keydown',SN.key);SN=null}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&SN&&SN.pause)SN.pause()});
function snake(i){
 stopT();stopSnake();L=WORLDS[i];L.idx=i;correct=0;points=0;streak=0;bestStreak=0;res=[];
 const rounds=snakeRounds(i);
 app.innerHTML=`<div class="screen">${hud()}
  <div class="dots">${rounds.map(()=>'<i></i>').join('')}</div>
  <div class="snq"><small id="snc">كُلِ الفعل الصحيح</small><div id="snp"></div></div>
  <div class="snwrap"><canvas id="snk" aria-label="ساحة الثعبان"></canvas>
   <div class="snover" id="sno"><div><div style="font-size:46px">🐍</div><b>حرّك الثعبان ليأكل الفعل الصحيح</b><p>الحاسوب: الأسهم • الجوال: اسحب على الساحة أو استخدم الأزرار</p><button class="b3d y" id="sgo">ابدأ ▶</button></div></div></div>
  <div class="pad"><button class="b3d g" data-d="0,-1" aria-label="أعلى">▲</button><div><button class="b3d g" data-d="1,0" aria-label="يمين">▶</button><button class="b3d g" data-d="0,1" aria-label="أسفل">▼</button><button class="b3d g" data-d="-1,0" aria-label="يسار">◀</button></div></div>
  <div class="btns"><button class="b3d g" id="bk">⬅ الألعاب</button></div></div>`;
 const cv=document.getElementById('snk'),x=cv.getContext('2d'),N=15;
 const size=Math.min(app.clientWidth,440);const dpr=window.devicePixelRatio||1;
 cv.style.width=cv.style.height=size+'px';cv.width=cv.height=size*dpr;x.scale(dpr,dpr);const C=size/N;
 SN={rounds,r:0,body:[[7,10],[7,11],[7,12]],dir:[0,-1],next:[0,-1],grow:0,tokens:[],stop:false,run:false,speed:260,flash:null};
 const S=SN;
 function place(){
  const R=S.rounds[S.r];const words=shuffle([{t:R.right,ok:1},...R.wrong.map(t=>({t,ok:0}))]);
  S.tokens=[];const head=S.body[0];
  for(const w of words){let p,tries=0;
   do{p=[1+Math.floor(Math.random()*(N-2)),1+Math.floor(Math.random()*(N-2))];tries++}
   while(tries<200&&(S.body.some(b=>b[0]===p[0]&&b[1]===p[1])||Math.abs(p[0]-head[0])+Math.abs(p[1]-head[1])<4||S.tokens.some(t=>Math.abs(t.p[0]-p[0])<4&&Math.abs(t.p[1]-p[1])<2)));
   S.tokens.push({...w,p})}
  document.getElementById('snp').innerHTML=R.prompt;
  document.getElementById('snc').textContent='كُلِ الفعل '+CASEN[R.c]+' الصحيح';
  const d=app.querySelectorAll('.dots i');d.forEach((e,j)=>{e.className=j<S.r?(res[j]?'ok':'no'):j===S.r?'cur':''});
 }
 function draw(){
  x.clearRect(0,0,size,size);
  for(let a=0;a<N;a++)for(let b=0;b<N;b++){x.fillStyle=(a+b)%2?'#1c5e66':'#196a72';x.fillRect(a*C,b*C,C,C)}
  S.tokens.forEach(t=>{const cx=t.p[0]*C+C/2,cy=t.p[1]*C+C/2;
   x.fillStyle='#ffd34e';x.beginPath();x.arc(cx,cy,C*.42,0,7);x.fill();x.fillStyle='#ff8a3d';x.beginPath();x.arc(cx,cy,C*.2,0,7);x.fill();
   x.font=`800 ${Math.max(14,C*.62)}px Cairo,Tahoma,sans-serif`;x.direction='rtl';x.textAlign='center';x.textBaseline='bottom';
   const w=x.measureText(t.t).width+12,ty=cy-C*.5;
   x.fillStyle='rgba(255,253,247,.96)';const bx=Math.min(Math.max(cx-w/2,2),size-w-2);
   x.beginPath();x.roundRect?x.roundRect(bx,ty-C*.85,w,C*.85,8):x.rect(bx,ty-C*.85,w,C*.85);x.fill();
   x.fillStyle='#1d2b3a';x.fillText(t.t,bx+w/2,ty-2)});
  S.body.forEach((b,j)=>{x.fillStyle=j===0?'#ff6f91':j%2?'#2ecc71':'#27b863';const r=C*.18;
   x.beginPath();x.roundRect?x.roundRect(b[0]*C+1.5,b[1]*C+1.5,C-3,C-3,r):x.rect(b[0]*C+1.5,b[1]*C+1.5,C-3,C-3);x.fill()});
  const h=S.body[0];x.fillStyle='#fff';x.beginPath();x.arc(h[0]*C+C*.35,h[1]*C+C*.38,C*.12,0,7);x.arc(h[0]*C+C*.65,h[1]*C+C*.38,C*.12,0,7);x.fill();
  if(S.flash){x.fillStyle=S.flash;x.globalAlpha=.25;x.fillRect(0,0,size,size);x.globalAlpha=1}
 }
 function over(msg){S.run=false;const o=document.getElementById('sno');o.hidden=false;
  o.innerHTML=`<div><div style="font-size:46px">💥</div><b>${msg}</b><button class="b3d y" id="sfin">النتيجة 🏁</button></div>`;
  document.getElementById('sfin').onclick=endSnake;beep('no')}
 function endSnake(){snLen=S.body.length;missList=S.rounds.filter((_,j)=>res[j]===false).map(R=>R.plain);extraStat=`<span class="pill">🐍 الطول ${AR(S.body.length)}</span>`;finish()}
 function step(){
  if(S.stop||!S.run)return;
  S.dir=S.next;const h=S.body[0];const nh=[(h[0]+S.dir[0]+N)%N,(h[1]+S.dir[1]+N)%N];
  if(S.body.slice(0,-1).some(b=>b[0]===nh[0]&&b[1]===nh[1])){draw();return over('اصطدم الثعبان بنفسه!')}
  S.body.unshift(nh);if(S.grow>0)S.grow--;else S.body.pop();
  const hit=S.tokens.find(t=>t.p[0]===nh[0]&&t.p[1]===nh[1]);
  if(hit){const R=S.rounds[S.r];const ok=!!hit.ok;res[S.r]=ok;
   if(ok){correct++;streak++;bestStreak=Math.max(bestStreak,streak);points+=100+(streak>=3?50:0);S.grow+=2;S.flash='#2ecc71';beep('ok');S.speed=Math.max(150,S.speed-10)}
   else{streak=0;if(S.body.length>3)S.body.pop();S.flash='#ff5b5b';beep('no');
    const f=document.getElementById('snc');f.textContent='✘ الصحيح: '+R.right;}
   document.getElementById('pts').textContent='🪙 '+AR(points);document.getElementById('stk').textContent='🔥 '+AR(streak);
   setTimeout(()=>{if(S)S.flash=null},250);
   S.r++;if(S.r>=S.rounds.length){draw();S.run=false;setTimeout(endSnake,500);return}
   if(ok)place();else{S.tokens=[];setTimeout(()=>{if(SN===S&&!S.stop)place()},900)}
  }
  draw();S.t=setTimeout(step,S.speed);
 }
 function turn(dx,dy){if(dx===-S.dir[0]&&dy===-S.dir[1])return;S.next=[dx,dy]}
 S.key=e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m&&S.run){e.preventDefault();turn(...m)}};
 addEventListener('keydown',S.key);
 app.querySelectorAll('[data-d]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();const [dx,dy]=b.dataset.d.split(',').map(Number);turn(dx,dy)});
 let ts=null;cv.addEventListener('touchstart',e=>{ts=e.touches[0]},{passive:true});
 cv.addEventListener('touchmove',e=>{if(S.run)e.preventDefault()},{passive:false});
 cv.addEventListener('touchend',e=>{if(!ts)return;const t=e.changedTouches[0],dx=t.clientX-ts.clientX,dy=t.clientY-ts.clientY;ts=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;Math.abs(dx)>Math.abs(dy)?turn(dx>0?1:-1,0):turn(0,dy>0?1:-1)});
 document.getElementById('bk').onclick=()=>{stopSnake();modes(i)};
 document.getElementById('sgo').onclick=()=>{document.getElementById('sno').hidden=true;S.run=true;step()};
 S.pause=()=>{if(S.run){S.run=false;clearTimeout(S.t);const o=document.getElementById('sno');if(o){o.hidden=false;o.innerHTML='<div><b>توقّف مؤقت</b><button class="b3d y" id="sres">تابع ▶</button></div>';document.getElementById('sres').onclick=()=>{o.hidden=true;S.run=true;step()}}}};
 place();draw();
}

function plane(i){
 stopT();stopSnake();L=WORLDS[i];L.idx=i;correct=0;points=0;streak=0;bestStreak=0;res=[];
 const rounds=snakeRounds(i);
 app.innerHTML=`<div class="screen">${hud()}
  <div class="dots">${rounds.map(()=>'<i></i>').join('')}</div>
  <div class="snq"><small id="snc">اصطدم بالفعل الصحيح</small><div id="snp"></div></div>
  <div class="snwrap"><canvas id="pln" aria-label="سماء الطائرة"></canvas>
   <div class="snover" id="sno"><div><div style="font-size:46px">✈️</div><b>وجّه الطائرة لتصطدم بالسحابة التي فيها الفعل الصحيح</b><p>الحاسوب: سهم أعلى وأسفل • الجوال: اسحب بإصبعك أو استخدم الأزرار</p><button class="b3d y" id="sgo">انطلق ▶</button></div></div></div>
  <div class="pad row"><button class="b3d g" data-v="-1" aria-label="أعلى">▲</button><button class="b3d g" data-v="1" aria-label="أسفل">▼</button></div>
  <div class="btns"><button class="b3d g" id="bk">⬅ الألعاب</button></div></div>`;
 const cv=document.getElementById('pln'),x=cv.getContext('2d');
 const W=Math.min(app.clientWidth,640),H=Math.round(Math.min(380,Math.max(280,W*.62))),dpr=window.devicePixelRatio||1;
 cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W*dpr;cv.height=H*dpr;x.scale(dpr,dpr);
 const LANES=5,lh=H/LANES;
 const P={r:0,y:H/2,ty:H/2,v:0,clouds:[],run:false,stop:false,speed:Math.max(1.6,W/260),t:0,boom:null,hold:0};
 SN={stop:false,t:null,key:null};const S=SN;
 const bg=Array.from({length:30},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.5}));
 function spawn(){
  const R=rounds[P.r];const lanes=shuffle([0,1,2,3,4]).slice(0,3);
  const words=shuffle([{t:R.right,ok:1},...R.wrong.map(t=>({t,ok:0}))]);
  P.clouds=words.map((w,k)=>({...w,x:W+60+k*70,y:lh*lanes[k]+lh/2,hit:false}));
  document.getElementById('snp').innerHTML=R.prompt;
  document.getElementById('snc').textContent='اصطدم بالفعل '+CASEN[R.c]+' الصحيح';
  app.querySelectorAll('.dots i').forEach((e,j)=>{e.className=j<P.r?(res[j]?'ok':'no'):j===P.r?'cur':''});
 }
 function cloud(cx,cy,w,h,col){x.fillStyle=col;x.beginPath();
  x.ellipse(cx,cy,w/2,h/2,0,0,7);x.ellipse(cx-w*.28,cy-h*.25,w*.24,h*.42,0,0,7);x.ellipse(cx+w*.2,cy-h*.32,w*.26,h*.45,0,0,7);x.fill()}
 function draw(){
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5ec8e5');g.addColorStop(1,'#bfeaf5');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.55)';bg.forEach(s=>{x.beginPath();x.arc(s.x,s.y,s.r*3,0,7);x.fill()});
  x.font=`800 ${Math.max(16,Math.min(22,lh*.42))}px Cairo,Tahoma,sans-serif`;x.direction='rtl';x.textAlign='center';x.textBaseline='middle';
  P.clouds.forEach(c=>{if(c.hit==='gone')return;const tw=x.measureText(c.t).width+36,h=Math.min(lh*.92,64);
   cloud(c.x,c.y,tw,h,c.hit==='ok'?'#c8f7d9':c.hit==='no'?'#ffd0d0':'#fff');x.fillStyle='#1d2b3a';x.fillText(c.t,c.x,c.y+2)});
  /* الطائرة */
  const px=W*.13,py=P.y;x.save();x.translate(px,py);x.rotate(Math.max(-.35,Math.min(.35,P.v*.04)));
  x.font=`${Math.min(46,lh*.9)}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.direction='ltr';
  x.rotate(Math.PI/4);x.fillText('✈️',0,0);x.restore();
  if(P.boom){x.font='40px sans-serif';x.textAlign='center';x.fillText(P.boom.e,P.boom.x,P.boom.y);}
 }
 function next(ok){
  res[P.r]=ok;
  if(ok){correct++;streak++;bestStreak=Math.max(bestStreak,streak);points+=100+(streak>=3?50:0);beep('ok');P.speed+=.15}
  else{streak=0;beep('no');document.getElementById('snc').textContent='✘ الصحيح: '+rounds[P.r].right}
  document.getElementById('pts').textContent='🪙 '+AR(points);document.getElementById('stk').textContent='🔥 '+AR(streak);
  P.r++;P.hold=ok?25:60;
  if(P.r>=rounds.length){P.run=false;setTimeout(endPlane,700)}
 }
 function endPlane(){missList=rounds.filter((_,j)=>res[j]===false).map(R=>R.plain);extraStat='<span class="pill">✈️ الطائرة</span>';finish()}
 function loop(){
  if(S.stop)return;
  if(P.run){
   P.y+=(P.ty-P.y)*.18;P.v=(P.ty-P.y)*.3;
   if(P.hold>0){P.hold--;if(P.hold===0&&P.r<rounds.length){P.clouds=[];P.boom=null;spawn()}}
   else{
    P.clouds.forEach(c=>{if(c.hit!=='gone')c.x-=P.speed});
    const px=W*.13;
    for(const c of P.clouds){if(c.hit)continue;
     if(Math.abs(c.x-px)<40&&Math.abs(c.y-P.y)<lh*.45){c.hit=c.ok?'ok':'no';P.boom={e:c.ok?'⭐':'💥',x:c.x,y:c.y-30};
      if(!c.ok){const r=P.clouds.find(z=>z.ok);if(r)r.hit='ok'}
      next(!!c.ok);break}}
    if(P.hold===0&&P.clouds.length&&P.clouds.every(c=>c.x<-80||c.hit)){if(!P.clouds.some(c=>c.hit))next(false);else P.clouds=[]}
   }
   bg.forEach(s=>{s.x-=P.speed*.3;if(s.x<-10)s.x=W+10});
  }
  draw();requestAnimationFrame(loop);
 }
 function move(d){P.ty=Math.max(lh/2,Math.min(H-lh/2,(Math.round((P.ty-lh/2)/lh)+d)*lh+lh/2))}
 S.key=e=>{if(!P.run)return;if(e.key==='ArrowUp'){e.preventDefault();move(-1)}else if(e.key==='ArrowDown'){e.preventDefault();move(1)}};
 addEventListener('keydown',S.key);
 app.querySelectorAll('[data-v]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();move(+b.dataset.v)});
 const setY=e=>{const r=cv.getBoundingClientRect();const t=(e.touches?e.touches[0]:e).clientY-r.top;P.ty=Math.max(lh/2,Math.min(H-lh/2,t))};
 cv.addEventListener('touchstart',e=>{if(P.run)setY(e)},{passive:true});
 cv.addEventListener('touchmove',e=>{if(P.run){e.preventDefault();setY(e)}},{passive:false});
 cv.addEventListener('pointerdown',e=>{if(P.run&&e.pointerType==='mouse')setY(e)});
 document.getElementById('bk').onclick=()=>{stopSnake();modes(i)};
 document.getElementById('sgo').onclick=()=>{document.getElementById('sno').hidden=true;P.run=true};
 S.pause=()=>{if(P.run){P.run=false;const o=document.getElementById('sno');if(o){o.hidden=false;o.innerHTML='<div><b>توقّف مؤقت</b><button class="b3d y" id="sres">تابع ▶</button></div>';document.getElementById('sres').onclick=()=>{o.hidden=true;P.run=true}}}};
 spawn();loop();
}

const LEVELS=[[0,'مبتدئ','🌱'],[1000,'متدرّب','📘'],[3000,'فارس','🛡️'],[6000,'بطل','🏆'],[10000,'أسطورة','🌟']];
function profAll(){try{return JSON.parse(localStorage.getItem('mu3tal-prof')||'{}')}catch(e){return{}}}
function prof(n){const a=profAll();return a[n]||{xp:0,badges:[],modes:[],worlds:[]}}
function profSave(n,p){try{const a=profAll();a[n]=p;localStorage.setItem('mu3tal-prof',JSON.stringify(a))}catch(e){}}
function levelOf(xp){let l=LEVELS[0],k=0;LEVELS.forEach((x,j)=>{if(xp>=x[0]){l=x;k=j}});const nx=LEVELS[k+1];return{name:l[1],icon:l[2],k,next:nx?nx[0]:null,from:l[0]}}
function awardBadges(n){
 const p=prof(player),had=new Set(p.badges),got=new Set(had),before=levelOf(p.xp).k;
 p.xp+=points;if(!p.modes.includes(MODE))p.modes.push(MODE);if(!p.worlds.includes(L.idx))p.worlds.push(L.idx);
 got.add('first');
 if(correct>=9)got.add('w'+L.idx);
 if(correct===n&&n===10)got.add('full');
 if(bestStreak>=5)got.add('fire');
 if(MODE==='adv'&&hearts>0){got.add('castle');if(hearts===3)got.add('heart')}
 if(MODE==='mem'&&mem.moves<=9)got.add('brain');
 if(MODE==='snake'&&snLen>=15)got.add('snake');
 if(MODE==='plane'&&correct===10)got.add('pilot');
 if(Object.keys(MODES).every(m=>p.modes.includes(m)))got.add('explorer');
 if([0,1,2,3].every(w=>p.worlds.includes(w)))got.add('traveler');
 if(['w0','w1','w2'].every(b=>got.has(b)))got.add('knight');
 p.badges=[...got];profSave(player,p);
 const fresh=BADGES.filter(b=>got.has(b.id)&&!had.has(b.id));
 return{fresh,p,lvUp:levelOf(p.xp).k>before?levelOf(p.xp):null};
}
function playerCard(){
 if(!player)return '';const p=prof(player),lv=levelOf(p.xp);
 const pct=lv.next?Math.round((p.xp-lv.from)/(lv.next-lv.from)*100):100;

}

function hud(){return `<div class="hud"><span class="pill nm">🧑‍🎓 ${esc(player)}</span><span class="pill">${L.icon} ${L.short}</span><span class="pill sp" id="pts">🪙 ${AR(points)}</span><span class="pill" id="stk">🔥 ${AR(streak)}</span></div>`}

function question(){
 answered=false;const Q=qs[qi];const long=!!Q.two;
 order=shuffle(Q.o.map((t,i)=>({t,i})));
 app.innerHTML=`<div class="screen">${hud()}
  ${MODE==='adv'?advTrail():`<div class="dots">${qs.map((_,j)=>`<i class="${j<qi?(res[j]?'ok':'no'):j===qi?'cur':''}"></i>`).join('')}</div>`}
  ${useTimer?'<div class="timer"><div id="tb"></div></div>':'<div style="height:8px"></div>'}
  <div class="qcard">
   <div class="qtop"><span class="n">${AR(qi+1)}</span><span>${Q.ask}</span><span class="tag">${MODE==='adv'&&qi>=qs.length-3?'👑 الزعيم':Q.tag}</span></div>
   <div class="sent">${Q.s}</div>
   <div class="answers ${long?'long':''}">${order.map((o,k)=>`<button class="b3d ans ${COLORS[k]}" data-k="${k}"><span class="sh">${SHAPES[k]}</span><span>${o.t}</span></button>`).join('')}</div>
   <div id="fb"></div>
   <div class="next"><button class="b3d y" id="nx" hidden>التالي ⬅</button></div>
  </div></div>`;
 app.querySelectorAll('.ans').forEach(b=>b.onclick=e=>pick(+b.dataset.k,e));
 if(useTimer)runT();
}

function runT(){stopT();tLeft=TIME;const tb=document.getElementById('tb');
 tmr=setInterval(()=>{tLeft-=.2;if(tb)tb.style.transform=`scaleX(${Math.max(0,tLeft/TIME)})`;if(tLeft<=0){stopT();pick(-1)}},200)}
function stopT(){if(tmr){clearInterval(tmr);tmr=null}}

function pick(k,e){
 if(answered)return;answered=true;stopT();const Q=qs[qi];const ok=k>=0&&order[k].i===Q.a;
 const btns=app.querySelectorAll('.ans');
 btns.forEach((b,j)=>{b.disabled=true;if(order[j].i===Q.a)b.classList.add('right');else if(j!==k)b.classList.add('dim')});
 if(k>=0&&!ok)btns[k].classList.add('wrong');
 res[qi]=ok;
 if(ok){correct++;streak++;bestStreak=Math.max(bestStreak,streak);const gain=100+(useTimer?Math.round(tLeft*4):0)+(streak>=3?50:0);points+=gain;
  if(e){const f=document.createElement('div');f.className='float';f.textContent='+'+AR(gain);f.style.left=e.clientX-30+'px';f.style.top=e.clientY-30+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1000)}}
 else{streak=0;if(MODE==='adv'){hearts--;const h=document.getElementById('hearts');if(h)h.innerHTML=heartsHtml()}}
 document.getElementById('pts').textContent='🪙 '+AR(points);document.getElementById('stk').textContent='🔥 '+AR(streak);
 beep(ok?'ok':'no');
 const head=ok?(streak>=3?'سلسلة نارية! 🔥':'أحسنت! ✔'):(k<0?'انتهى الوقت ⏰':'انتبه ✘');
 document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${head}</b><span>${ok?'':'الصحيح: «'+Q.o[Q.a]+'». '}${Q.why}</span></div>`;
 const dead=MODE==='adv'&&hearts<=0;const last=dead||qi===qs.length-1;const nx=document.getElementById('nx');nx.hidden=false;nx.textContent=dead?'💔 انتهت القلوب – النتيجة':last?'النتيجة 🏁':MODE==='adv'?'تقدّم 👣':'التالي ⬅';
 nx.onclick=()=>{if(!last){qi++;question()}else finish()};nx.focus();
}

  ${AW.lvUp?`<div class="lvup">⬆️ ارتقيت إلى مستوى <b>${AW.lvUp.icon} ${AW.lvUp.name}</b>!</div>`:''}

  <div class="btns">${st>=1?'<button class="b3d o" id="cert">🎓 شهادتي</button>':''}<button class="b3d p" id="again">العب مجددًا 🔁</button><button class="b3d" id="hm">العوالم 🗺️</button></div>

 if(st>=2||AW.fresh.length){beep('win');confetti()}
 if(st>=1&&window.KIT){const co={name:player,stars:st,score:'الدرجة: '+AR(correct)+' من '+AR(n),hdr:HDR,text:'لإتمامه «'+MODES[MODE].name+'» في عالم «'+L.name+'» من مغامرة الفعل المعتل بنجاح'};document.getElementById('cert').onclick=()=>KIT.certificate(co);setTimeout(()=>{if(document.getElementById('cert'))KIT.certificate(co)},1500)}
 const rec={name:player,lesson:L.idx,mode:MODE,badges:AW.p.badges.length,newBadges:AW.fresh.map(b=>b.i+' '+b.n),correct,total:n,points,streak:bestStreak,miss:(MODE==='quiz'||MODE==='adv'?qs.map((q,j)=>res[j]===false?q.s.replace(/<[^>]+>/g,'').replace('؟','____'):null):missList).filter(Boolean).slice(0,10),at:Date.now()};
 saveResult(rec).then(w=>{const s=document.getElementById('sv');if(s)s.textContent=w==='shared'?'✅ وصلت نتيجتك إلى المعلم':'✅ حُفظت النتيجة على هذا الجهاز'});

 /* أفضل درجة لكل طالب في كل عالم */
 const bestOf={};all.forEach(r=>{const k=r.name+'|'+r.lesson;if(!bestOf[k]||r.correct>bestOf[k].correct)bestOf[k]=r});
 const names=STUDENTS.length?STUDENTS:[...played];

 let body='';
 if(rTab==='grid'){
  body=`<div class="scroll"><table class="res"><thead><tr><th>م</th><th>اسم الطالب</th>${WORLDS.map(w=>`<th class="c">${w.icon} ${w.short}</th>`).join('')}<th class="c">الأوسمة</th><th class="c">المحاولات</th></tr></thead><tbody>
  ${[...names,...extra].map((n,i)=>`<tr><td>${AR(i+1)}</td><td>${esc(n)}</td>${WORLDS.map((w,j)=>{const b=bestOf[n+'|'+j];return `<td class="c">${b?`<span class="sc ${scls(b.correct,b.total||10)}">${AR(b.correct)}/${AR(b.total||10)}</span>`:'<span class="sn">—</span>'}</td>`}).join('')}<td class="c">🎖️ ${AR(Math.max(0,...all.filter(r=>r.name===n).map(r=>r.badges||0)))}</td><td class="c">${AR(all.filter(r=>r.name===n).length)}</td></tr>`).join('')}
  </tbody></table></div><p class="note">تعرض اللوحة أفضل درجة لكل طالب في كل عالم، والشَّرطة (—) تعني أنه لم يلعب ذلك العالم بعد.</p>`;
 }else if(!mine.length){
  body=`<div class="empty">لا توجد نتائج بعد. حين ينهي طالب أي عالم تظهر نتيجته هنا مباشرة.</div>`;
 }else{
  body=`<div class="scroll"><table class="res"><thead><tr><th>الوقت</th><th>اسم الطالب</th><th>الدرس</th><th class="c">الدرجة</th><th class="c">النقاط</th><th>الأوسمة الجديدة والأخطاء</th></tr></thead><tbody>
  ${mine.map(r=>{const w=WORLDS[r.lesson]||{};return `<tr><td>${fmtT(r.at)}</td><td>${esc(r.name)}</td><td>${w.icon||''} ${w.short||''}<br><small>${(MODES[r.mode||'quiz']||{}).icon||''} ${(MODES[r.mode||'quiz']||{}).name||''}</small></td><td class="c"><span class="sc ${scls(r.correct,r.total||10)}">${AR(r.correct)}/${AR(r.total||10)}</span></td><td class="c">${AR(r.points||0)}</td><td style="font-size:13px">${(r.newBadges||[]).length?`<div style="color:#8a6400;font-weight:800">${r.newBadges.map(esc).join(' • ')}</div>`:''}${(r.miss||[]).map(esc).join('<br>')||'<span class="sn">لا أخطاء 🎉</span>'}</td></tr>`}).join('')}

 app.innerHTML=`<div class="screen"><div class="rp">
  <h1>📊 نتائج الطلاب</h1>
  <p class="meta">مغامرة الفعل المعتل • الصف السادس • ${DB?'نتائج كل الأجهزة، تتحدث تلقائيًا':'النتائج المحفوظة على هذا الجهاز فقط'}</p>
  <div class="kpis"><div class="kpi"><b>${AR(all.length)}</b><span>محاولة</span></div><div class="kpi"><b>${AR(played.size)} / ${AR(STUDENTS.length||played.size)}</b><span>طالب لعبوا</span></div><div class="kpi"><b>${AR(avg.toFixed(1))}</b><span>متوسط الدرجة من ١٠</span></div><div class="kpi"><b>${AR(all.filter(r=>r.correct>=9).length)}</b><span>وسام فرسان العربية</span></div></div>
  <div class="tabs" role="tablist">${tabs.map(([k,t])=>`<button class="tab" role="tab" data-t="${k}" aria-selected="${rTab===k}">${t}</button>`).join('')}</div>

   <span style="display:flex;gap:10px;flex-wrap:wrap"><button class="b3d o" id="csv">⬇ تنزيل Excel (CSV)</button>${rConfirm?`<span class="confirm">حذف كل النتائج نهائيًا؟ <button class="b3d p" id="yes">نعم، احذف</button><button class="b3d g" id="no">إلغاء</button></span>`:`<button class="b3d p" id="clr">🗑 مسح النتائج</button>`}</span></div>
  <p class="note" id="msg"></p></div></div>`;
 app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{rTab=b.dataset.t;results()});
 document.getElementById('bk').onclick=()=>{try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}stopLive();home()};
 document.getElementById('csv').onclick=()=>exportCsv(all);
 const clr=document.getElementById('clr');if(clr)clr.onclick=()=>{rConfirm=true;results()};
 const no=document.getElementById('no');if(no)no.onclick=()=>{rConfirm=false;results()};
 const yes=document.getElementById('yes');if(yes)yes.onclick=async()=>{yes.disabled=true;
  if(DB){for(const r of all){if(r.id){try{await DB.doc('results/'+r.id).delete()}catch(e){}}}}
  try{localStorage.removeItem(LOCAL_KEY)}catch(e){}
  rConfirm=false;results()};
 startLive();
}
/* تحديث مباشر حين يُنهي طالب عالمًا */
let unsub=null,liveT=null;
function startLive(){if(!DB||unsub)return;let first=true;
 try{unsub=DB.collection('results').orderBy('at','desc').limit(1).onSnapshot(()=>{if(first){first=false;return}clearTimeout(liveT);liveT=setTimeout(()=>{if(location.hash==='#results'&&!rConfirm)results()},400)},()=>{unsub=null})}catch(e){}}
function stopLive(){if(unsub){try{unsub()}catch(e){}unsub=null}}
async function exportCsv(all){
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const rows=[['التاريخ','اسم الطالب','الدرس','الدرجة','من','النقاط','الأسئلة الخاطئة'].map(q).join(',')]
  .concat(all.map(r=>[fmtT(r.at),r.name,((WORLDS[r.lesson]||{}).name||'')+' – '+((MODES[r.mode||'quiz']||{}).name||''),r.correct,r.total||10,r.points||0,(r.miss||[]).join(' | ')].map(q).join(',')));
 const data='﻿'+rows.join('\r\n');const m=document.getElementById('msg');
 const dl=window.claude&&claude.use?await claude.use('downloads'):null;
 if(dl){try{await dl.save({filename:'نتائج_مغامرة_الفعل_المعتل.csv',data});m.textContent='✅ تم التنزيل'}catch(e){m.textContent=e&&e.code==='declined'?'':'تعذّر التنزيل من هنا.'}return}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download='نتائج_مغامرة_الفعل_المعتل.csv';a.click();m.textContent='✅ تم التنزيل'}catch(e){m.textContent='تعذّر التنزيل من هنا.'}
}

function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=['#0f9d9a','#ff8a3d','#ffd34e','#ff6f91','#2ecc71'];
 for(let i=0;i<80;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=c[i%5];d.style.animationDuration=(1.8+Math.random()*1.8)+'s';d.style.animationDelay=Math.random()*.7+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4600)}}

/* نجوم الخلفية */
(function(){const cv=document.getElementById('sky'),x=cv.getContext('2d');let W,H,S=[];
 function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;S=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,p:Math.random()*6}))}
 rs();addEventListener('resize',rs);const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
 function f(t){x.clearRect(0,0,W,H);S.forEach(s=>{x.globalAlpha=.35+.45*Math.abs(Math.sin(s.p+t/1400));x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});if(!still)requestAnimationFrame(f)}
 f(0)})();

home();
